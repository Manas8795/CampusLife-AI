name: CampusLife AI — CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Stage 1: Code Quality Gate
  # Runs linting, type checking, and security scanning in parallel.
  # All checks must pass before tests are allowed to run.
  # ──────────────────────────────────────────────────────────────────────────
  quality:
    name: Code Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: "Lint: ruff (PEP8 + code style)"
        run: |
          ruff check backend/ tests/ --output-format=github

      - name: "Security: bandit (OWASP A02 — secrets & injection scan)"
        run: |
          bandit -r backend/app/ \
            --skip B101,B311 \
            --severity-level medium \
            --exit-zero

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 2: Test Suite with Coverage
  # Seeds the database, runs all tests, uploads coverage report.
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    needs: quality   # Only runs after quality gate passes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov coverage

      - name: Seed database
        run: |
          python -m backend.seed_data

      - name: Run Pytest suite with coverage
        run: |
          pytest tests/ -v \
            --cov=backend/app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60
        env:
          # Provide dummy credentials so config.py does not warn about missing vars
          SECRET_KEY: "ci-test-secret-key-not-real"
          TWILIO_ACCOUNT_SID: "AC_CI_DUMMY"
          TWILIO_AUTH_TOKEN: "ci_dummy_token"
          TWILIO_PHONE_NUMBER: "+10000000000"
          TELEGRAM_BOT_TOKEN: "0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          TELEGRAM_CHAT_ID: "0"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
