<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Neural Core Hologram Rings -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Outer Quantum Ring -->
    <circle r="150" fill="none" stroke="url(#glow)" stroke-width="4" stroke-dasharray="16 12" opacity="0.65"/>
    <circle r="120" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" opacity="0.8"/>
    <!-- Concentric Neural Energy -->
    <circle r="85" fill="none" stroke="#6366f1" stroke-width="5" opacity="0.9"/>
    
    <!-- Central AI Core Sphere -->
    <circle r="56" fill="url(#glow)"/>
    
    <!-- Student Mortarboard / AI Spark Glyphs -->
    <path d="M-40,-8 L0,-24 L40,-8 L0,8 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M0,8 L0,26" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="28" cy="18" r="5" fill="#38bdf8"/>
    <path d="M28,18 L40,32" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Pulsing Nodes -->
    <circle cx="-106" cy="-106" r="8" fill="#38bdf8"/>
    <circle cx="106" cy="-106" r="8" fill="#6366f1"/>
    <circle cx="-106" cy="106" r="8" fill="#10b981"/>
    <circle cx="106" cy="106" r="8" fill="#f43f5e"/>
  </g>
</svg>
